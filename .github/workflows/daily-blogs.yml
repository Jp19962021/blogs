name: Daily Blog Posts

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  petscript-pharmacy-vet-blog:
    name: PetScript Pharmacy (Vet Audience)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./scripts

      - name: Run vet blog script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_PHARMACY_CLIENT_ID: ${{ secrets.SHOPIFY_PHARMACY_CLIENT_ID }}
          SHOPIFY_PHARMACY_CLIENT_SECRET: ${{ secrets.SHOPIFY_PHARMACY_CLIENT_SECRET }}
          SHOPIFY_PHARMACY_STORE: ${{ secrets.SHOPIFY_PHARMACY_STORE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          STORE_AUDIENCE: vet
        run: node generate-blog.js
        working-directory: ./scripts

      - name: Commit run log
        run: |
          git config --global user.name "PetScript Bot"
          git config --global user.email "bot@petscriptpharmacy.com"
          git add docs/run-log.json
          git diff --staged --quiet || (git commit -m "Update blog run log $(date +'%Y-%m-%d') vet" && git pull --rebase && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  petscript-direct-petowner-blog:
    name: PetScript Direct (Pet Owner Audience)
    runs-on: ubuntu-latest
    needs: petscript-pharmacy-vet-blog
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./scripts

      - name: Run pet owner blog script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_DIRECT_CLIENT_ID: ${{ secrets.SHOPIFY_DIRECT_CLIENT_ID }}
          SHOPIFY_DIRECT_CLIENT_SECRET: ${{ secrets.SHOPIFY_DIRECT_CLIENT_SECRET }}
          SHOPIFY_DIRECT_STORE: ${{ secrets.SHOPIFY_DIRECT_STORE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          STORE_AUDIENCE: petowner
        run: node generate-blog.js
        working-directory: ./scripts

      - name: Commit run log
        run: |
          git config --global user.name "PetScript Bot"
          git config --global user.email "bot@petscriptpharmacy.com"
          git add docs/run-log.json
          git diff --staged --quiet || (git commit -m "Update blog run log $(date +'%Y-%m-%d') petowner" && git pull --rebase && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
