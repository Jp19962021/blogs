name: Weekly Blog Recap Email

on:
  schedule:
    # Every Friday at 8:00 AM CT (13:00 UTC CDT / 14:00 UTC CST)
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  send-weekly-recap:
    name: Create Weekly Recap Email in Klaviyo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./scripts

      - name: Generate and create Klaviyo campaign draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
        run: node weekly-email.js
        working-directory: ./scripts
